[package]
name = "abyss-top"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight KVM/QEMU hypervisor TUI monitor for RHEL"
license = "Apache-2.0"

# FIPS posture: this binary intentionally has NO crypto dependencies.
# If TLS/HTTPS telemetry export is added later, link dynamically against the
# host's FIPS-validated OpenSSL (RHEL system OpenSSL in FIPS mode) or use
# `aws-lc-rs` with the `fips` feature. Do NOT introduce `ring` or RustCrypto.

[dependencies]
anyhow    = "1.0"
crossterm = "0.27"
ratatui   = "0.26"
sysinfo   = "0.30"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
